services:
  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATA_DIR: /app/data
      NODE_ENV: production
      PORT: "5000"
      WEB_ROOT: /app/web
    volumes:
      - ../apps/server/data:/app/data
    ports:
      - "5000:5000"

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
